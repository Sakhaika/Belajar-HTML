<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home - Selamat Datang</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: Arial, sans-serif;
            line-height: 1.6;
            color: #333;
        }
        
        header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 1rem 0;
            text-align: center;
        }
        
        nav {
            background-color: #333;
            padding: 0.5rem;
        }
        
        nav a {
            color: white;
            text-decoration: none;
            margin: 0 1rem;
            display: inline-block;
        }
        
        nav a:hover {
            color: #667eea;
        }
        
        .hero {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 4rem 2rem;
            text-align: center;
        }
        
        .hero h1 {
            font-size: 2.5rem;
            margin-bottom: 1rem;
        }
        
        .hero p {
            font-size: 1.2rem;
            margin-bottom: 2rem;
        }
        
        .btn {
            background-color: white;
            color: #667eea;
            padding: 0.8rem 1.5rem;
            text-decoration: none;
            border-radius: 5px;
            font-weight: bold;
            display: inline-block;
        }
        
        .btn:hover {
            background-color: #f0f0f0;
        }
        
        footer {
            background-color: #333;
            color: white;
            text-align: center;
            padding: 1rem;
            margin-top: 2rem;
        }
    </style>
</head>
<body>
    <nav>
        <a href="#home">Home</a>
        <a href="#about">Tentang</a>
        <a href="#services">Layanan</a>
        <a href="#contact">Kontak</a>
    </nav>
    <header>
        <h1>Selamat Datang</h1>
        <p>Website Sederhana untuk Pembelajaran</p>
    </header>
    
    
    <section class="hero">
        <h1>Halo! 👋</h1>
        <p>Ini adalah halaman pembuka website sederhana Anda</p>
        <a href="#" class="btn">Mulai</a>
    </section>
    
    <footer>
        <p>&copy; 2024 Website Sederhana. Semua hak dilindungi.</p>
    </footer>
</body>
</html>
