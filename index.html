<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Sakha Belajar</title>
</head>
<style>
    /* Additional styles for a more elegant look */
    body {
        background: linear-gradient(to right, #e0eafc, #cfdef3);
    }
    h1 {
        text-align: center;
        font-weight: bold;
        font-size: 3em;
        color: #007BFF;
        letter-spacing: 2px;
        text-shadow: 3px 3px 6px rgba(0, 0, 0, 0.2);
        text-transform: uppercase;
        font-size: 2.5em;
        margin-bottom: 20px;
        text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
    }
    li {
        background: #ffffff;
        border: 1px solid #ddd;
        transition: transform 0.2s;
    }
    li:hover {
        transform: scale(1.02);
        border-color: #007BFF;
    }
    a {
        border: 2px solid #007BFF;
        transition: all 0.3s;
    }
    a:hover {
        background: #0056b3;
        border-color: #0056b3;
    }
    .home, .about, .contact {
        text-align: center;
    }
    body {
        font-family: Arial, sans-serif;
        background-color: #f4f4f4;
        margin: 0;
        padding: 20px;
    }
    h1 {
        color: #333;
    }
    ul {
        list-style-type: none;
        padding: 0;
    }
    li {
        background: #fff;
        margin: 5px 0;
        padding: 10px;
        border-radius: 5px;
        box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
    }
    a {
        text-decoration: none;
        color: #007BFF;
        padding: 10px 15px;
        border-radius: 5px;
        transition: background 0.3s;
    }
    a:hover {
        background: #007BFF;
        color: white;
    }
    .home, .about, .contact {
        margin-top: 20px;
    }
</style>
<body>
    <h1>Belajar HTML Untuk Pemula</h1>
    <ul>
        <li>Nama          : Sakha</li>
        <li>Email         : sakha@gmail.com</li>
        <li>Nomor Telepon : 08123456789</li>
        <li>alamat        : Jl. Raya Kebon Jeruk No. 123</li>
    </ul>
    <p>Lorem ipsum dolor sit amet, consectetur adipisicing elit. Tenetur libero obcaecati ullam sit?</p>
    <div class="home">
        <a href="home.html">Home</a>
    </div>
    <div class="about">
        <a href="about.html">About</a>
    </div>
    <div class="contact">
        <a href="contact.html">Contact</a>
    </div>
</body>
</html>
